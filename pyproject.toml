[build-system]
requires = [
    "setuptools>=80", 
    #"setuptools-scm>8"
]
build-backend = "setuptools.build_meta"

[project]
name = "tank_fill_modbus"
#dynamic = ["version"]
version = "1.0.0"
authors =[{name = "Bradley Lane Kicklighter, P.E.", email = "blkickligh@usi.edu"}]
description = "Tank fill simulation that communicates with a PLC via Modbus TCP."
dependencies = [
    "userpaths>=0.1.3",
    "pymodbus>=3.13.0"
]
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICEN[CS]E.*"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    #"License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
tankfillmodbus = "tank_fill_modbus.tankfillmodbus:main"

[project.urls]
Repository = "https://github.com/blkickli/TankFillModbus"
